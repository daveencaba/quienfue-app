name: Compilar app iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto iOS
        run: npx cap add ios

      - name: Permisos de ubicación y audio en segundo plano
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Para saber en qué calle estás." $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Para seguir tu ubicación con la pantalla apagada." $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string location" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string audio" $PLIST

      - name: Sincronizar
        run: npx cap sync ios

      - name: Compilar sin firmar
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r QuienFue.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: QuienFue-ipa
          path: QuienFue.ipa
